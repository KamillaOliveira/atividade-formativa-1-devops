name: Continuous Delivery

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Executar testes unitarios
        run: |
          python -m unittest discover -s . -p "test_*.py"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Executar Deploy de CD
        run: |
          echo "Realizando implantacao continua..."
          echo "Deploy realizado com sucesso!"

  notificar_discord:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Enviar Notificacao para o Discord
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          title: "Status da Pipeline DevOps - Paladino"
          description: "Resultado do workflow no repositorio atividade-formativa-1-devops."
          color: 0x00ff00
          username: "Paladino CI/CD Bot"